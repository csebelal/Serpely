    <!--
      Consent Mode v2 defaults. Nothing is loaded from Google here — this only
      initialises the dataLayer and declares every consent signal as "denied",
      which is what Google requires to be in place *before* the tag loads.
      Google Tag Manager itself is loaded by src/components/CookieConsent.tsx
      and only after the visitor grants analytics consent.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      window.__SERPELY_GTM_ID = 'GTM-N7V8SHH7';
    </script>

server {
    listen 80;
    server_name serpely.com www.serpely.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name serpely.com www.serpely.com;

    ssl_certificate /etc/letsencrypt/live/serpely.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serpely.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ─── Hardening ───────────────────────────────────────────────────────────
    server_tokens off;
    # Image uploads are 10 MB in multer; nginx's default is 1m and would 413.
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression for text assets (JS/CSS/HTML/JSON/SVG) — Phase 1
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    root /var/www/serpely/app/dist;
    index index.html;

    # Static assets with cache + CORS (needed for Vite module scripts with crossorigin)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type";
        add_header X-Content-Type-Options nosniff always;
    }

    # MCP (Streamable HTTP) — same backend, no extra VPS
    location ~ ^/mcp(/.*)?$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/public-audit/compare + full crawls can run ~60-120s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Uploaded files (filenames unique per upload → immutable).
    # Extensions are forced server-side to an image type; nosniff is a second
    # line of defence against content-type confusion.
    location /uploads/ {
        alias /var/www/serpely/server/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        # Never execute HTML/SVG from the uploads directory.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # SPA fallback — static files served directly, HTML routes proxy to Express for head code injection
    # Note: $uri/ omitted intentionally — it matches root dir and serves index.html directly, bypassing @spa
    location / {
        try_files $uri @spa;
    }

    location @spa {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
